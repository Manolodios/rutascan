# Keep-alive: capa ADICIONAL para que Render (plan gratis) no duerma.
# ---------------------------------------------------------------------------
# Render duerme el servicio tras 15 minutos sin visitas; el primer acceso
# despues tarda ~30-60 segundos ("Application loading"). Este trabajo toca
# /health y la portada... pero NO es la capa principal. Medido el 25-26 oct
# 2026: de ~90 marcas del reloj, GitHub solo ejecuto 4 (cada 2-6 horas, el
# resto descartado). Eso no alcanza para ganarle a los 15 min de Render.
#
# Capas, en orden de confianza (ver docs/DESPLIEGUE-NUBE.md):
#   1) UptimeRobot (gratis, sin tarjeta): monitor cada 5 min. LA PRINCIPAL.
#   2) Tarea de Windows "MANTENER DESPIERTO.bat": cada 13 min con la PC
#      prendida y la sesion abierta. CAE 100% medido (40/40 pings OK).
#   3) Este trabajo de GitHub: cuando toca, toca; pero toca poco.
#
# Se mantiene porque es gratis y suma: cada ping que si llega es uno menos
# que Render puede colgar. Y si el servicio se cae de verdad, la ejecucion
# falla y GitHub avisa por correo (informacion, no error del trabajo).
#
# Corre en los servidores de GitHub: funciona aunque su PC este apagada.
# Los repos privados tienen 2.000 minutos gratis al mes; cada ejecucion dura
# unos segundos (no necesita descargar el repositorio).

name: Keep-alive

on:
  schedule:
    # Cada 13 minutos (0,13,26,39,52...): por debajo de los 15 de Render.
    - cron: '*/13 * * * *'
  workflow_dispatch: # para ejecutarlo a mano desde la pestana Actions

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Despertar rutascan.onrender.com
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Tocar /health y la portada
        shell: bash
        run: |
          set -uo pipefail
          for url in "https://rutascan.onrender.com/health" "https://rutascan.onrender.com/"; do
            echo "-> $url"
            code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
                     --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors \
                     "$url" || echo 000)"
            echo "   HTTP $code"
            head -c 300 /tmp/body.txt; echo
            if [ "$code" != "200" ]; then
              echo "::error::No se pudo despertar $url (HTTP $code)"
              exit 1
            fi
          done
          echo "Servicio despierto."
