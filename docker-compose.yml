name: rutascan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rutascan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rutascan}
      POSTGRES_DB: ${POSTGRES_DB:-rutascan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rutascan}:${POSTGRES_PASSWORD:-rutascan}@db:5432/${POSTGRES_DB:-rutascan}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      WEB_DIR: /web
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ./web:/web:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
