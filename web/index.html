    <title>RutaScan · Panel de control</title>
    <script>
      // Apply the saved theme (or the system preference) before first paint
      // so the panel never flashes light after a reload.
      try {
        var stored = localStorage.getItem("rutascan.theme");
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        /* localStorage unavailable: keep light theme */
      }
    </script>
