name: rutascan
description: RutaScan mobile app - offline-first cargo scanning for drivers and warehouse staff.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Networking
  http: ^1.2.0
  http_parser: ^4.0.2
  # Local persistence (offline queue)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  # Camera / scanning
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  # Location
  geolocator: ^12.0.0
  # Connectivity
  connectivity_plus: ^6.0.3
  # Feedback (beeps + vibration)
  audioplayers: ^6.1.0
  vibration: ^3.2.1
  # Proof of delivery
  signature: ^5.4.1
  # Misc
  uuid: ^4.4.0
  intl: ^0.19.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
